name: Blacksmith Testbox

# Manual, opt-in remote proof only. Blacksmith supplies the Linux machine;
# repository-native tests remain the authority.
#
# Broad deterministic gate:
#   npm run check
# Thin deployed-contract boundary:
#   npm run smoke:deploy
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true

jobs:
  resplit-currency-api:
    name: Resplit Currency API test-ready environment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
