name: Transfer currency CI credentials to Resplit monorepo
on: workflow_dispatch
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Install sealed-box encryption
        run: python3 -m pip install --quiet pynacl
      - name: Encrypt for the destination repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SENTRY_CURRENCY_API_DSN: ${{ secrets.SENTRY_CURRENCY_API_DSN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          names = ('CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'CRON_SECRET', 'SENTRY_CURRENCY_API_DSN')
          box = SealedBox(PublicKey(base64.b64decode('p6+VwZip909u6gEG0xI+IYtasfdYayL76TYf3Fz7Wjg=')))
          encrypted = {}
          for name in names:
              value = os.environ.get(name, '')
              if not value:
                  raise SystemExit('Missing required source secret: ' + name)
              encrypted[name] = base64.b64encode(box.encrypt(value.encode())).decode()
          with open('encrypted-monorepo-secrets.json', 'w') as out:
              json.dump({'recipient': 'firstbitelabsllc/resplit-ios', 'key_id': '3380204578043523366', 'secrets': encrypted}, out)
          print('Encrypted four existing credentials for the destination repository.')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-monorepo-secrets
          path: encrypted-monorepo-secrets.json
          retention-days: 1
